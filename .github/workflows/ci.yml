name: CI

# Three independent build/test jobs (backend, ML sidecar, frontend), then a
# final job that builds every Docker image and boots the REAL docker-compose
# stack (MySQL, MongoDB, Redis, Kafka, ML sidecar, backend, frontend) to
# prove the whole system actually comes up together — this pipeline goes
# "till docker compose": it validates the full stack boots healthy, it does
# not deploy anywhere beyond that.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

# Cancel a stale run on the same branch/PR when new commits land.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend: Java 17 / Spring Boot / Maven ─────────────────────────────────
  backend:
    name: Backend — test & build (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gigshield-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Runs the Mockito-based unit suite: DisruptionEventVerificationServiceTest,
      # DisruptionEventListenerTest, ClaimServiceTest, FraudServiceTest,
      # PolicyServiceTest, AuthServiceTest. GigshieldBackendApplicationTests
      # is excluded here — it's a bare @SpringBootTest contextLoads() check
      # that needs a real MySQL/MongoDB/Redis/Kafka to pass, none of which
      # exist in this fast job. The compose-integration job below boots the
      # real app against real infrastructure, which is a strictly stronger
      # version of the same check, so it isn't run twice.
      - name: Run unit test suite
        run: ./mvnw -B -ntp test -Dtest='!GigshieldBackendApplicationTests'

      - name: Build jar (tests already ran above)
        run: ./mvnw -B -ntp -DskipTests package

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: gigshield-backend/target/surefire-reports
          retention-days: 7

  # ── ML sidecar: FastAPI / Python ────────────────────────────────────────────
  ml-sidecar:
    name: ML sidecar — pipeline simulation (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gigshield-ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gigshield-ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start the ML sidecar
        run: |
          nohup python3 -m uvicorn app:app --host 0.0.0.0 --port 5000 \
            > /tmp/ml_sidecar.log 2>&1 &
          echo $! > /tmp/ml_sidecar.pid

      - name: Wait for it to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/health > /dev/null; then
              echo "ML sidecar is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::ML sidecar never became healthy"
          cat /tmp/ml_sidecar.log
          exit 1

      # Real, running FastAPI process — not a mock. Covers the event->claim
      # genuineness gate, fraud strikes/ban, the full claim->payment Kafka
      # chain (line-cited business-logic simulation, since no broker exists
      # in this job), and the risk-score/premium severity regression check.
      - name: Run pipeline simulation test suite
        run: python3 tests/test_pipeline_simulation.py

      - name: Dump sidecar logs on failure
        if: failure()
        run: cat /tmp/ml_sidecar.log

      - name: Stop the sidecar
        if: always()
        run: kill "$(cat /tmp/ml_sidecar.pid)" 2>/dev/null || true

  # ── Frontend: React / Vite ──────────────────────────────────────────────────
  frontend:
    name: Frontend — lint & build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gigshield-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gigshield-frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080
          VITE_RAZORPAY_KEY_ID: ""

  # ── Full stack: build every image, boot docker-compose, verify healthy ─────
  compose-integration:
    name: Full stack — docker compose build & boot
    runs-on: ubuntu-latest
    needs: [backend, ml-sidecar, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted ubuntu runners ship Docker + the Compose v2 plugin
      # already — no extra setup action needed.
      - name: Build all service images
        run: docker compose build

      # --wait blocks until every service with a healthcheck reports
      # "healthy" (all seven services here define one — see
      # docker-compose.yml / each service's Dockerfile), and exits non-zero
      # if any never becomes healthy or exits early within the timeout.
      # This is what makes "till docker compose" a real pass/fail signal,
      # not just "the containers started".
      - name: Boot the full stack and wait for every service to be healthy
        run: docker compose up -d --wait --wait-timeout 300

      - name: Show what actually came up
        run: docker compose ps

      # Extra outside-the-network confidence check on top of the compose
      # healthchecks, hitting the same host ports docker-compose.yml exposes.
      - name: Smoke test each service from the host
        run: |
          curl -sf http://localhost:5000/health && echo " -> ml-sidecar OK"
          curl -sf http://localhost:8080/actuator/health && echo " -> backend OK"
          curl -sf http://localhost:3000/ > /dev/null && echo "frontend OK"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
