name: gigshield

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: gigshield-root
      MYSQL_DATABASE: gigshield
      MYSQL_USER: DB
      MYSQL_PASSWORD: Mysqldb#1
    ports:
      - "3307:3306"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  ml-sidecar:
    build:
      context: ./gigshield-ml
    ports:
      - "5000:5000"

  backend:
    build:
      context: ./gigshield-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/gigshield?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
      MONGO_URI: mongodb://mongo:27017/gigshield
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ML_BASE_URL: http://ml-sidecar:5000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-minimum-32-characters-long!!}
      SMS_MOCK: "true"
    depends_on:
      - mysql
      - mongo
      - redis
      - kafka
      - ml-sidecar
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./gigshield-frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
    depends_on:
      - backend
    ports:
      - "3000:80"
